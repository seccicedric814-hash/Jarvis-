
name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check Android project
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "::error::Le fichier gradlew est absent du dépôt."
            exit 1
          fi
          if [ ! -f "./settings.gradle" ] && [ ! -f "./settings.gradle.kts" ]; then
            echo "::error::Le fichier settings.gradle est absent."
            exit 1
          fi
          if [ ! -f "./app/build.gradle" ] && [ ! -f "./app/build.gradle.kts" ]; then
            echo "::error::La configuration Gradle du module app est absente."
            exit 1
          fi
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: JARVIS-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
